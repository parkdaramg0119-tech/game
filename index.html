<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>초록빛 오후 | 온실 생활 게임</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26392d;font-family:system-ui,"Malgun Gothic",sans-serif}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #27352b}
.hotspot{position:absolute;top:0;height:9%;width:6.5%;border:0;background:transparent;pointer-events:auto;cursor:pointer}
.hotspot:focus-visible{outline:2px solid white;border-radius:12px}
#bag{left:37.2%}#journal{left:45.1%}#decorate{left:52.8%}#map{left:60.6%}#friends{left:68.3%}
#settings{position:absolute;right:7.4%;top:0;width:5%;height:8%;background:transparent;border:0;pointer-events:auto;cursor:pointer}
#full{position:absolute;right:0.7%;top:0;width:5.5%;height:8%;background:transparent;border:0;pointer-events:auto;cursor:pointer}
#panel{display:none;position:absolute;right:20px;top:82px;width:min(340px,88vw);max-height:72vh;overflow:auto;background:#fff8e9f5;color:#4d493b;text-shadow:none;border:2px solid #f0d9ac;border-radius:18px;padding:17px;pointer-events:auto;box-shadow:0 10px 30px #14251b88}
#panel h2{margin:0 0 10px;font-size:20px;color:#55734e}
#panel p{font-size:14px;line-height:1.55;margin:7px 0}
#panel button,.choice{border:0;border-radius:11px;background:#718c63;color:white;padding:9px 13px;margin:4px 4px 4px 0;font-weight:800;cursor:pointer}
#panel button.secondary{background:#b8a88b;color:#433d32}
#panel .item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e8ddc9;font-size:14px}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#26392dcc;border:1px solid #ffffff66;border-radius:18px;padding:9px 16px;font-size:13px;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .15s}
#hint.show{opacity:1}
#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);background:#26392de8;border:1px solid #fff8;border-radius:18px;padding:10px 17px;font-size:14px;font-weight:800;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}
#mobile{position:absolute;left:14px;bottom:15px;display:none;pointer-events:auto;gap:5px}
#mobile button{width:43px;height:43px;border:1px solid #fff9;border-radius:12px;background:#293c2dbb;color:white;font-size:18px}
@media(max-width:700px){#mobile{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}#mobile .up{grid-column:2}#mobile .left{grid-column:1;grid-row:2}#mobile .down{grid-column:2;grid-row:2}#mobile .right{grid-column:3;grid-row:2}#hint{bottom:112px;font-size:11px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <button class="hotspot" id="bag" aria-label="가방"></button>
 <button class="hotspot" id="journal" aria-label="도감"></button>
 <button class="hotspot" id="decorate" aria-label="꾸미기"></button>
 <button class="hotspot" id="map" aria-label="지도"></button>
 <button class="hotspot" id="friends" aria-label="친구"></button>
 <button id="settings" aria-label="설정"></button><button id="full" aria-label="전체 화면"></button>
 <div id="panel"><h2 id="ptitle"></h2><div id="pbody"></div><button class="secondary" id="close">닫기</button></div>
 <div id="hint"></div><div id="toast"></div>
 <div id="mobile"><button class="up" data-k="ArrowUp">↑</button><button class="left" data-k="ArrowLeft">←</button><button class="down" data-k="ArrowDown">↓</button><button class="right" data-k="ArrowRight">→</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const bg=new Image();bg.src='assets/greenhouse-background.png';
const MW=1536,MH=1024;
let vw=innerWidth,vh=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;canvas.width=vw*dpr;canvas.height=vh*dpr;canvas.style.width=vw+'px';canvas.style.height=vh+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const player={x:710,y:665,dir:'down',walk:0,speed:205,step:0};
let keys={},last=performance.now(),coins=250,scene='온실',panelOpen=false,decorateMode=false;
let inventory={씨앗:3,물뿌리개:1,데이지:0,튤립:0};
let plants=[{x:590,y:795,type:'데이지',stage:1,water:false},{x:650,y:795,type:'튤립',stage:0,water:false},{x:710,y:795,type:'라벤더',stage:1,water:false}];
let friends=[{name:'치즈 고양이',met:false,desc:'온실 안에서 낮잠을 즐기는 고양이.'},{name:'정원 토끼',met:false,desc:'꽃밭 근처에서 만날 수 있는 수줍은 토끼.'}];
let decor=[];
try{const s=JSON.parse(localStorage.getItem('greenhouseSave')||'null');if(s){coins=s.coins??coins;inventory=s.inventory||inventory;plants=s.plants||plants;decor=s.decor||[];}}catch(e){}
const save=()=>{localStorage.setItem('greenhouseSave',JSON.stringify({coins,inventory,plants,decor}))};
function worldToScreen(x,y){return [x/MW*vw,y/MH*vh]}
function screenToWorld(x,y){return [x/vw*MW,y/vh*MH]}
function polyHit(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){let a=pts[i],b=pts[j];if(((a[1]>y)!=(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c}
const walkZones=[
 [[180,360],[820,360],[900,490],[910,690],[820,900],[260,900],[160,760]],
 [[875,515],[1020,475],[1150,450],[1340,450],[1440,600],[1420,870],[1210,930],[1010,850],[900,700]]
];
const obstacles=[
 [330,535,165,112],[420,645,200,100],[90,650,150,150],[560,285,160,160],
 [730,690,95,105],[220,410,100,90],[765,390,115,100],[1120,280,230,110],
 [1160,535,160,90],[1280,740,180,110],[180,820,160,90]
];
function canWalk(x,y){
 if(!walkZones.some(p=>polyHit(x,y,p)))return false;
 for(const [a,b,w,h] of obstacles)if(x>a&&x<a+w&&y>b&&y<b+h)return false;
 if(x>1180&&y>800)return false; // pond edge
 return true;
}
function drawSprite(x,y,dir,walking,t){
 const [sx,sy]=worldToScreen(x,y),s=Math.min(vw/MW,vh/MH)*1.15;
 ctx.save();ctx.translate(sx,sy+Math.sin(t*12)*(walking?1.4:0));ctx.scale(s,s);
 // soft shadow
 ctx.fillStyle='#283b2c55';ctx.beginPath();ctx.ellipse(0,2,13,5,0,0,Math.PI*2);ctx.fill();
 const step=walking?Math.sin(t*13)*2:0;
 // boots and socks
 ctx.fillStyle='#65442f';ctx.fillRect(-7,17+step,6,6);ctx.fillRect(2,17-step,6,6);
 ctx.fillStyle='#f2dfbd';ctx.fillRect(-7,14+step,6,4);ctx.fillRect(2,14-step,6,4);
 // body, cream blouse and sage pinafore
 ctx.fillStyle='#f5e8cf';ctx.fillRect(-8,0,16,15);
 ctx.fillStyle='#78936a';ctx.fillRect(-9,5,18,12);ctx.fillRect(-6,2,12,4);
 ctx.fillStyle='#d5a06c';ctx.fillRect(-2,8,4,3);
 // sleeves and hands
 ctx.fillStyle='#f1c6a3';ctx.fillRect(-12,4,4,9);ctx.fillRect(8,4,4,9);
 // hair
 ctx.fillStyle='#65402e';ctx.fillRect(-10,-15,20,17);ctx.fillRect(-12,-10,4,12);ctx.fillRect(8,-10,4,12);
 // face
 ctx.fillStyle='#f3c9a8';ctx.fillRect(-7,-11,14,13);
 ctx.fillStyle='#65402e';ctx.fillRect(-8,-16,16,6);ctx.fillRect(-8,-11,4,4);ctx.fillRect(4,-11,4,4);
 ctx.fillStyle='#3a2e27';ctx.fillRect(-4,-6,2,2);ctx.fillRect(3,-6,2,2);
 ctx.fillStyle='#d98278';ctx.fillRect(-4,-2,3,1);ctx.fillRect(3,-2,3,1);
 ctx.fillStyle='#f3d47c';ctx.fillRect(7,-12,3,3);ctx.fillRect(9,-10,2,2);
 // direction hint: tiny face profile shift
 if(dir==='left'||dir==='right'){ctx.fillStyle='#3a2e27';ctx.fillRect(dir==='left'?-5:3,-6,2,2)}
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,vw,vh);
 if(bg.complete&&bg.naturalWidth){ctx.imageSmoothingEnabled=true;ctx.drawImage(bg,0,0,vw,vh)}
 // Draw game-state flowers over the garden planters as a small live layer.
 for(const p of plants){const [x,y]=worldToScreen(p.x,p.y);ctx.save();ctx.translate(x,y);ctx.scale(vw/MW,vh/MH);
  ctx.fillStyle='#49613e';ctx.fillRect(-2,0,4,15);
  ctx.fillStyle=p.type==='튤립'?'#df8d79':p.type==='라벤더'?'#a18ac6':'#f3d779';
  if(p.stage>0){ctx.fillRect(-6,-8,5,5);ctx.fillRect(2,-10,5,5);ctx.fillRect(-2,-13,5,5)}
  if(p.water){ctx.fillStyle='#8ed2e4';ctx.fillRect(7,-2,3,3)}
  ctx.restore();
 }
 for(const d of decor){const [x,y]=worldToScreen(d.x,d.y);ctx.font=`${Math.max(16,22*vw/MW)}px serif`;ctx.fillText('🪴',x,y)}
 drawSprite(player.x,player.y,player.dir,player.walk>0,player.walk);
 requestAnimationFrame(draw);
}
bg.onload=draw;draw();
function tick(now){
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(!panelOpen){
  let dx=0,dy=0;if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;
  if(dx||dy){let n=Math.hypot(dx,dy);dx/=n;dy/=n;let nx=player.x+dx*player.speed*dt,ny=player.y+dy*player.speed*dt;
   if(canWalk(nx,player.y))player.x=nx;if(canWalk(player.x,ny))player.y=ny;
   player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');player.walk+=dt;
  }else player.walk=0;
 }
 const near=nearestTarget();const hint=document.getElementById('hint');
 if(!panelOpen&&near){hint.textContent='E  '+near.label;hint.classList.add('show')}else hint.classList.remove('show');
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
const targets=[
 {x:920,y:570,r:115,label:'온실 문 열기',act:door},
 {x:610,y:795,r:65,label:'꽃 모종 살펴보기',act:plantAction},
 {x:670,y:520,r:80,label:'고양이와 인사하기',act:catAction},
 {x:1110,y:720,r:85,label:'정원 토끼 만나기',act:rabbitAction},
 {x:510,y:410,r:75,label:'작업대 살펴보기',act:workbench}
];
function nearestTarget(){let best=null,dist=1e9;for(const t of targets){let d=Math.hypot(player.x-t.x,player.y-t.y);if(d<t.r&&d<dist){best=t;dist=d}}return best}
function interact(){let t=nearestTarget();if(t){t.act();return}
 const p=plants.find(p=>Math.hypot(player.x-p.x,player.y-p.y)<70);if(p){plantAction(p);return}toast('조금 더 가까이 다가가 봐!')}
function door(){scene=scene==='온실'?'정원':'온실';if(scene==='정원'){player.x=1030;player.y=600;toast('정원으로 나왔어! 꽃길을 걸어 보자 🌷')}else{player.x=850;player.y=570;toast('따뜻한 온실로 돌아왔어. 🌿')}}
function plantAction(p){if(!p)p=plants.reduce((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)<Math.hypot(player.x-b.x,player.y-b.y)?a:b);
 if(p.stage===0){if(inventory['씨앗']>0){inventory['씨앗']--;p.stage=1;toast(p.type+' 씨앗을 심었어!')}else toast('씨앗이 없어. 작업대에서 씨앗을 받아 보자.')}
 else if(!p.water){p.water=true;toast(p.type+'에 물을 줬어. 내일 더 자랄 거야!')}
 else toast('오늘은 충분히 돌봐줬어. 내일 다시 확인하자.');save()}
function catAction(){friends[0].met=true;toast('고양이: “야옹… 여기 햇살이 참 좋아.” 🐈');save()}
function rabbitAction(){friends[1].met=true;toast('토끼: “꽃밭에 놀러 와 줘서 고마워!” 🐇');save()}
function workbench(){openPanel('작업대',`<p>정원 가꾸기에 필요한 씨앗을 챙겨 가자.</p><button id="getSeeds">씨앗 3개 받기</button>`);document.getElementById('getSeeds').onclick=()=>{inventory['씨앗']+=3;save();toast('씨앗 3개를 챙겼어!');closePanel()}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2300)}
function openPanel(title,body){panelOpen=true;document.getElementById('ptitle').textContent=title;document.getElementById('pbody').innerHTML=body;document.getElementById('panel').style.display='block'}
function closePanel(){panelOpen=false;document.getElementById('panel').style.display='none'}
document.getElementById('close').onclick=closePanel;
function panelButton(id,fn){document.getElementById(id).onclick=fn}
panelButton('bag',()=>openPanel('가방',Object.entries(inventory).map(([k,v])=>`<div class="item"><span>${k}</span><b>${v}개</b></div>`).join('')+`<p>씨앗을 심고 물을 주며 정원을 가꿔 봐!</p>`));
panelButton('journal',()=>openPanel('식물 도감',`<p>🌼 데이지 — 햇살을 좋아하는 작은 꽃</p><p>🌷 튤립 — 봄 정원에 잘 어울리는 꽃</p><p>💜 라벤더 — 은은한 향기가 나는 허브</p><p>발견한 꽃: ${plants.filter(p=>p.stage>0).length}/3</p>`));
panelButton('decorate',()=>{decorateMode=!decorateMode;closePanel();toast(decorateMode?'꾸미기 모드! 정원 바닥을 클릭해 화분을 놓아 봐.':'꾸미기 모드를 종료했어.')});
panelButton('map',()=>openPanel('마을 지도',`<p>🏡 온실 ${scene==='온실'?'(현재 위치)':''}</p><p>🌷 꽃 정원 ${scene==='정원'?'(현재 위치)':''}</p><p>문 앞에서 E키를 누르면 두 장소 사이를 이동할 수 있어.</p>`));
panelButton('friends',()=>openPanel('숲속 친구',friends.map(f=>`<div class="item"><span>${f.name}</span><b>${f.met?'만남 완료':'아직 만나지 않음'}</b></div><p>${f.desc}</p>`).join('')));
panelButton('settings',()=>openPanel('설정',`<p>게임 진행 상황은 이 브라우저에 자동 저장돼.</p><button id="reset">저장 데이터 초기화</button>`));
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='e'&&!e.repeat&&!panelOpen)interact();if(k==='escape')closePanel();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('#mobile button').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
canvas.addEventListener('click',e=>{if(!decorateMode)return;let r=canvas.getBoundingClientRect(),[x,y]=screenToWorld(e.clientX-r.left,e.clientY-r.top);if(!walkZones.some(p=>polyHit(x,y,p))){toast('걸어 다닐 수 있는 바닥에만 놓을 수 있어.');return}decor.push({x,y});decorateMode=false;save();toast('작은 화분을 놓았어!')});
document.addEventListener('click',e=>{if(e.target&&e.target.id==='reset'){localStorage.removeItem('greenhouseSave');location.reload()}});
save();
})();
</script>
</body></html>
